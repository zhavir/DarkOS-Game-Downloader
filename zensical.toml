[project]
site_name = "dArkOS Downloader"
site_description = "Install, search, update, and manage games on an RK3326 R36S running dArkOS."
site_author = "Andrea Aramini"
site_url = "https://zhavir.github.io/DarkOS-Game-Downloader/"
repo_url = "https://github.com/zhavir/DarkOS-Game-Downloader"
repo_name = "zhavir/DarkOS-Game-Downloader"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Andrea Aramini"
nav = [
  { "Home" = "index.md" },
  { "Install on R36S" = "install.md" },
  { "Using the TUI" = "usage.md" },
  { "Compatibility" = "compatibility.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/gamepad-2"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "deep-purple"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "deep-purple"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
