name: Sync GitHub rulesets
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/rulesets/*.json"
      - ".github/workflows/sync-rulesets.yml"
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify token
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::RULESET_TOKEN is empty or unavailable"
            exit 1
          fi

          is_admin="$(
            gh api "repos/${GH_REPO}" \
              --jq '.permissions.admin'
          )"

          if [[ "${is_admin}" != "true" ]]; then
            echo "::error::The account associated with RULESET_TOKEN is not a repository administrator"
            exit 1
          fi
      - name: Create or update rulesets
        shell: bash
        run: |
          set -euo pipefail

          for file in .github/rulesets/*.json; do
            echo "Processing ${file}"

            payload="$(mktemp)"

            jq '{
              name,
              target,
              enforcement,
              bypass_actors,
              conditions,
              rules
            }' "${file}" > "${payload}"

            name="$(jq -r '.name' "${payload}")"

            ruleset_id="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GH_REPO}/rulesets?includes_parents=false&per_page=100" |
              jq -r --arg name "${name}" \
                '.[] | select(.name == $name) | .id' |
              head -n 1
            )"

            if [[ -n "${ruleset_id}" ]]; then
              echo "Updating '${name}'"

              gh api \
                --method PUT \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GH_REPO}/rulesets/${ruleset_id}" \
                --input "${payload}"
            else
              echo "Creating '${name}'"

              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/${GH_REPO}/rulesets" \
                --input "${payload}"
            fi

            rm -f "${payload}"
          done
