name: Sync GitHub rulesets
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/rulesets/*.json"
      - ".github/workflows/sync-rulesets.yml"
jobs:
  sync:
    name: Apply repository rulesets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create or update rulesets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          for file in .github/rulesets/*.json; do
            echo "Processing ${file}"

            payload="$(mktemp)"

            # Keep only fields accepted by the create/update API.
            jq '{
              name,
              target,
              enforcement,
              bypass_actors,
              conditions,
              rules
            }' "${file}" > "${payload}"

            name="$(jq -r '.name' "${payload}")"

            ruleset_id="$(
              gh api \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GH_REPO}/rulesets?includes_parents=false&per_page=100" |
              jq -r --arg name "${name}" \
                '.[] | select(.name == $name) | .id' |
              head -n 1
            )"

            if [[ -n "${ruleset_id}" ]]; then
              echo "Updating '${name}' (${ruleset_id})"

              gh api \
                --method PUT \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GH_REPO}/rulesets/${ruleset_id}" \
                --input "${payload}"
            else
              echo "Creating '${name}'"

              gh api \
                --method POST \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "/repos/${GH_REPO}/rulesets" \
                --input "${payload}"
            fi

            rm "${payload}"
          done
