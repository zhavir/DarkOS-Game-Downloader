name: Documentation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - docs/**
      - pyproject.toml
      - README.md
      - src/**
      - tests/**
      - uv.lock
      - zensical.toml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Build and deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked documentation environment
        run: uv sync --frozen
      - name: Prepare coverage output
        run: mkdir -p coverage-reports
      - name: Measure complete test coverage
        env:
          DW_LIVE_BASE_URL: https://vimm.net
          DW_LIVE_MINERVA_BASE_URL: https://minerva-archive.org
          DW_LIVE_MINERVA_TORRENT_BASE_URL: https://cdn.minerva-archive.org/torrents
        run: >-
          uv run --frozen pytest --cov=dw_cli --cov-branch --cov-report=term-missing --cov-report=xml:coverage-reports/coverage.xml --cov-report=json:coverage-reports/coverage.json --cov-report=html:coverage-reports/html --cov-report=markdown-append:${GITHUB_STEP_SUMMARY}
      - name: Build documentation
        run: uv run --frozen zensical build --clean --strict
      - name: Add browsable coverage report
        run: |
          cp coverage-reports/coverage.json site/coverage.json
          cp -R coverage-reports/html site/coverage
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
