name: Documentation
on:
  repository_dispatch:
    types: [release-documentation]
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Build and deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked documentation environment
        run: uv sync --frozen
      - name: Download released revision coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-main-${{ github.event.client_payload.sha }}
          path: coverage-reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.client_payload.run_id }}
      - name: Build documentation
        run: uv run --frozen zensical build --clean --strict
      - name: Add browsable coverage report
        run: |
          cp coverage-reports/coverage.json coverage.json
          cp coverage.json site/coverage.json
          cp -R coverage-reports/html site/coverage
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
      - name: Update coverage badge
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: we-cli/coverage-badge-action@main
