name: Pull request checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked development environment
        run: uv sync --frozen
      - name: Run pre-commit checks
        run: uv run --frozen prek run --all-files
  tests:
    name: All tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked development environment
        run: uv sync --frozen
      - name: Prepare coverage output
        run: mkdir -p coverage-reports
      - name: Run unit, integration, and offline E2E tests
        run: >-
          uv run --frozen pytest -v -m "not live" --cov=dw_cli --cov-branch --cov-report=term-missing --cov-report=xml:coverage-reports/coverage.xml --cov-report=json:coverage-reports/coverage.json --cov-report=html:coverage-reports/html --cov-report=markdown-append:${GITHUB_STEP_SUMMARY}
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-pr-${{ github.event.pull_request.number }}
          path: coverage-reports/
          if-no-files-found: error
