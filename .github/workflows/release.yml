name: Release main
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked development environment
        run: uv sync --frozen
      - name: Run pre-commit checks
        run: uv run --frozen prek run --all-files
  tests:
    name: All tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked development environment
        run: uv sync --frozen
      - name: Prepare coverage output
        run: mkdir -p coverage-reports
      - name: Run offline, integration, and real-service E2E tests
        env:
          DW_LIVE_BASE_URL: https://vimm.net
          DW_LIVE_MINERVA_BASE_URL: https://minerva-archive.org
          DW_LIVE_MINERVA_TORRENT_BASE_URL: https://cdn.minerva-archive.org/torrents
        run: >-
          uv run --frozen pytest -v --cov=dw_cli --cov-branch --cov-report=term-missing --cov-report=xml:coverage-reports/coverage.xml --cov-report=json:coverage-reports/coverage.json --cov-report=html:coverage-reports/html --cov-report=markdown-append:${GITHUB_STEP_SUMMARY}
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-main-${{ github.sha }}
          path: coverage-reports/
          if-no-files-found: error
  release:
    name: Version, build, and publish
    needs: [pre-commit, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out main with release history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked development environment
        run: uv sync --frozen
      - name: Create semantic version, changelog, tag, and GitHub release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          build: "true"
      - name: Verify released lock file
        if: steps.release.outputs.released == 'true'
        run: uv lock --check
      - name: Install dArkOS build prerequisites
        if: steps.release.outputs.released == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl file zip
      - name: Build release artifacts
        if: steps.release.outputs.released == 'true'
        env:
          NEW_VERSION: ${{ steps.release.outputs.version }}
        run: sh scripts/build_artifacts.sh
      - name: Upload artifacts to GitHub release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
      - name: Preserve workflow artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.release.outputs.tag }}-release-artifacts
          path: dist/
          if-no-files-found: error
      - name: Request documentation deployment
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method POST repos/${GITHUB_REPOSITORY}/dispatches -f event_type=release-documentation -F "client_payload[run_id]=${GITHUB_RUN_ID}" -f "client_payload[sha]=${GITHUB_SHA}"
