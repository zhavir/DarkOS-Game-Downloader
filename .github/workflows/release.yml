name: Release main
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked development environment
        run: uv sync --frozen
      - name: Run pre-commit checks
        run: uv run --frozen prek run --all-files
  tests:
    name: All tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked development environment
        run: uv sync --frozen
      - name: Prepare coverage output
        run: mkdir -p coverage-reports
      - name: Run unit, integration, and offline E2E tests
        run: >-
          uv run --frozen pytest -v -m "not live" --cov=ph --cov-branch --cov-report=term-missing --cov-report=xml:coverage-reports/coverage.xml --cov-report=json:coverage-reports/coverage.json --cov-report=html:coverage-reports/html --cov-report=markdown-append:${GITHUB_STEP_SUMMARY}
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-main-${{ github.sha }}
          path: coverage-reports/
          if-no-files-found: error
  release:
    name: Version and publish release
    needs: [pre-commit, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create release GitHub App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out main with release history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.release-token.outputs.token }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked development environment
        run: uv sync --frozen
      - name: Create semantic version, changelog, tag, and GitHub release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ steps.release-token.outputs.token }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          # This runs only the version/lock validation hook from pyproject.toml.
          # Distributable artifacts are built by the downstream jobs.
          build: "true"
      - name: Verify released lock file
        if: steps.release.outputs.released == 'true'
        run: uv lock --check
  build-python-distributions:
    name: Build Python distributions
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out released revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Build wheel and source distribution
        env:
          NEW_VERSION: ${{ needs.release.outputs.version }}
        run: sh scripts/build_artifacts.sh --python
      - name: Preserve Python distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.release.outputs.tag }}-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
  build-platform-artifacts:
    name: Build ${{ matrix.name }} artifact
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DarkOS ARM64
            target: darkos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out released revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - name: Install Python
        run: uv python install 3.14
      - name: Install platform build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl file zip
      - name: Build platform artifact
        env:
          NEW_VERSION: ${{ needs.release.outputs.version }}
        run: sh scripts/build_artifacts.sh --platform "${{ matrix.target }}"
      - name: Preserve platform artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.release.outputs.tag }}-${{ matrix.target }}
          path: dist/pocket-harbor-${{ needs.release.outputs.version }}-${{ matrix.target }}-*.zip
          if-no-files-found: error
  publish-artifacts:
    name: Publish release artifacts
    needs: [release, build-python-distributions, build-platform-artifacts]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all independently built artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ${{ needs.release.outputs.tag }}-*
          path: dist
          merge-multiple: true
      - name: Upload artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
      - name: Request documentation deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release.outputs.commit_sha }}
        run: >-
          gh api --method POST repos/${GITHUB_REPOSITORY}/dispatches -f event_type=release-documentation -F "client_payload[run_id]=${GITHUB_RUN_ID}" -f "client_payload[sha]=${RELEASE_SHA}"
